name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Tests + corpus benchmark
        run: pytest -s

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        continue-on-error: true  # advisory: never blocks, always visible
        run: |
          pip install pip-audit
          pip install .
          pip-audit

  build-image-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t promptwarden:ci .
      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          image: promptwarden:ci
          format: spdx-json
          artifact-name: promptwarden-sbom.spdx.json
