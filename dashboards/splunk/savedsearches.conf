# PromptWarden starter content for Splunk.
# Assumes events ingested with sourcetype=promptwarden (HEC sink does this).

[PromptWarden - Blocked LLM Traffic (24h)]
search = sourcetype=promptwarden status=block \
| spath output=rule_id path=finding_info{}.rule_id \
| spath output=owasp path=finding_info{}.owasp_llm_top10 \
| stats count by rule_id owasp \
| sort -count
dispatch.earliest_time = -24h
description = Blocked requests/responses by rule and OWASP LLM Top 10 category.

[PromptWarden - Prompt Injection Burst Alert]
search = sourcetype=promptwarden status=block \
| spath output=owasp path=finding_info{}.owasp_llm_top10 \
| search owasp=LLM01 \
| bucket _time span=5m \
| stats count by _time metadata.app_id \
| where count > 10
dispatch.earliest_time = -60m
cron_schedule = */15 * * * *
description = More than 10 blocked injection attempts against one app in 5 minutes; possible automated probing.

[PromptWarden - Canary Leak (Critical)]
search = sourcetype=promptwarden \
| spath output=rule_id path=finding_info{}.rule_id \
| search rule_id=PW-C001
dispatch.earliest_time = -24h
cron_schedule = */5 * * * *
description = System prompt canary token observed in model output. Deterministic leak; treat as an incident.

[PromptWarden - Secret Egress by App]
search = sourcetype=promptwarden \
| spath output=detector path=finding_info{}.detector \
| search detector=secrets \
| stats count by metadata.app_id status \
| sort -count
dispatch.earliest_time = -7d
description = Secret/PII detections per application over 7 days; identifies apps leaking credentials into or out of LLM traffic.

# --- v0.2 content: agent traffic, shadow mode, tenancy, consumption ---------
# Finding events are class_uid=2004; per-request audit records are
# class_uid=6003 (enable with audit.enabled in policy).

[PromptWarden - Tool Poisoning or Tool Definition Change (Critical)]
search = sourcetype=promptwarden class_uid=2004 \
| spath output=rule_id path=finding_info{}.rule_id \
| spath output=tool path=finding_info{}.tool_name \
| search rule_id IN ("PW-T002", "PW-T003", "PW-T004", "PW-T005") \
| stats count min(_time) as first_seen max(_time) as last_seen by rule_id tool metadata.app_id \
| convert ctime(first_seen) ctime(last_seen)
dispatch.earliest_time = -24h
cron_schedule = */10 * * * *
description = A tool offered to a model contains hidden instructions (PW-T002), no longer matches its pinned hash (PW-T003), changed while running (PW-T004), or is unpinned where pins are required (PW-T005). Treat PW-T002 and PW-T003 as a supply chain incident: identify the MCP server or plugin that served the definition.

[PromptWarden - Denied Tool Call Attempt]
search = sourcetype=promptwarden class_uid=2004 \
| spath output=rule_id path=finding_info{}.rule_id \
| spath output=tool path=finding_info{}.tool_name \
| search rule_id="PW-T001" \
| stats count by tool metadata.app_id actor.user
dispatch.earliest_time = -24h
cron_schedule = */15 * * * *
description = A model asked to call a tool that policy denies. One hit can be a model mistake; repeated hits for one user or app usually mean an injection is steering the agent.

[PromptWarden - Indirect Injection by Source]
search = sourcetype=promptwarden class_uid=2004 \
| spath output=source path=finding_info{}.source \
| spath output=atlas path=finding_info{}.mitre_atlas \
| search atlas="AML.T0051.001" \
| stats count by source metadata.app_id disposition \
| sort -count
dispatch.earliest_time = -7d
description = Injections that arrived in tool results, documents or tool definitions rather than from the user. Shows which data source is carrying hostile content.

[PromptWarden - Data Leaving Through Tool Calls]
search = sourcetype=promptwarden class_uid=2004 \
| spath output=atlas path=finding_info{}.mitre_atlas \
| spath output=rule_id path=finding_info{}.rule_id \
| spath output=tool path=finding_info{}.tool_name \
| search atlas="AML.T0086" \
| table _time metadata.app_id actor.user tool rule_id metadata.uid
dispatch.earliest_time = -24h
cron_schedule = */5 * * * *
description = A secret or system-prompt canary appeared in tool-call arguments. The agent was about to send it somewhere through a tool.

[PromptWarden - Shadow Mode Rollout Report]
search = sourcetype=promptwarden class_uid=2004 disposition=would_block \
| spath output=rule_id path=finding_info{}.rule_id \
| stats count dc(metadata.uid) as requests by metadata.app_id rule_id \
| sort -count
dispatch.earliest_time = -7d
description = What enforce mode would have blocked, per app and rule. Review before switching an app from monitor to enforce: every row is either an attack or a false positive to tune out.

[PromptWarden - Obfuscated Payloads]
search = sourcetype=promptwarden class_uid=2004 \
| spath output=tags path=finding_info{}.tags{} \
| search tags="obfuscated" \
| stats count by metadata.app_id actor.user src_endpoint.ip \
| sort -count
dispatch.earliest_time = -7d
description = Detections that only fired after de-obfuscation (invisible characters, homoglyphs, leetspeak, base64). Benign users do not obfuscate; this list is close to a list of people probing the control.

[PromptWarden - Gateway Auth Failures and Rate Limits]
search = sourcetype=promptwarden class_uid=2004 activity_name=llm_gateway_control \
| spath output=rule_id path=finding_info{}.rule_id \
| eval hits = 1 + coalesce(suppressed_count, 0) \
| stats sum(hits) as hits by rule_id metadata.app_id src_endpoint.ip \
| sort -hits
dispatch.earliest_time = -24h
description = PW-G001 rate limit, PW-G002 bad or missing gateway key, PW-G003 model not allowed. Events are throttled at the gateway; suppressed_count carries what was collapsed.

[PromptWarden - Token Spend by App (requires audit events)]
search = sourcetype=promptwarden class_uid=6003 \
| stats sum(usage.prompt_tokens) as prompt_tokens sum(usage.completion_tokens) as completion_tokens count as requests by metadata.app_id llm.model \
| sort -completion_tokens
dispatch.earliest_time = -7d
description = Token consumption per application and model for chargeback and for spotting runaway agents (OWASP LLM10).

[PromptWarden - Policy Change Detected]
search = sourcetype=promptwarden \
| stats min(_time) as first_seen max(_time) as last_seen count by metadata.policy_hash metadata.mode \
| convert ctime(first_seen) ctime(last_seen) \
| sort first_seen
dispatch.earliest_time = -7d
description = Every policy version that produced events. A new hash you did not deploy, or a switch to monitor mode, is a control change to investigate.
