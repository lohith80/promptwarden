# PromptWarden starter content for Splunk.
# Assumes events ingested with sourcetype=promptwarden (HEC sink does this).

[PromptWarden - Blocked LLM Traffic (24h)]
search = sourcetype=promptwarden status=block \
| spath output=rule_id path=finding_info{}.rule_id \
| spath output=owasp path=finding_info{}.owasp_llm_top10 \
| stats count by rule_id owasp \
| sort -count
dispatch.earliest_time = -24h
description = Blocked requests/responses by rule and OWASP LLM Top 10 category.

[PromptWarden - Prompt Injection Burst Alert]
search = sourcetype=promptwarden status=block \
| spath output=owasp path=finding_info{}.owasp_llm_top10 \
| search owasp=LLM01 \
| bucket _time span=5m \
| stats count by _time metadata.app_id \
| where count > 10
dispatch.earliest_time = -60m
cron_schedule = */15 * * * *
description = More than 10 blocked injection attempts against one app in 5 minutes; possible automated probing.

[PromptWarden - Canary Leak (Critical)]
search = sourcetype=promptwarden \
| spath output=rule_id path=finding_info{}.rule_id \
| search rule_id=PW-C001
dispatch.earliest_time = -24h
cron_schedule = */5 * * * *
description = System prompt canary token observed in model output. Deterministic leak; treat as an incident.

[PromptWarden - Secret Egress by App]
search = sourcetype=promptwarden \
| spath output=detector path=finding_info{}.detector \
| search detector=secrets \
| stats count by metadata.app_id status \
| sort -count
dispatch.earliest_time = -7d
description = Secret/PII detections per application over 7 days; identifies apps leaking credentials into or out of LLM traffic.
