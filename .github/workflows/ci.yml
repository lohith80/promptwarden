name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests scripts
      - name: Validate example policy
        run: promptwarden validate-policy config/policy.example.yaml
      - name: Tests + corpus benchmark
        run: python -m pytest -s

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        continue-on-error: true  # advisory: never blocks, always visible
        run: |
          pip install pip-audit
          pip install .
          pip-audit

  build-image-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t promptwarden:ci .
      - name: Smoke test image (non-root, read-only filesystem)
        run: |
          docker run -d --name pw --read-only --cap-drop ALL -p 8080:8080 promptwarden:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/readyz && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/readyz | grep -q '"status":"ready"'
          test "$(docker exec pw id -u)" = "10001"
          docker rm -f pw
      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          image: promptwarden:ci
          format: spdx-json
          artifact-name: promptwarden-sbom.spdx.json
