apiVersion: apps/v1
kind: Deployment
metadata:
  name: promptwarden
  namespace: promptwarden
  labels:
    app.kubernetes.io/name: promptwarden
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: promptwarden
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: promptwarden
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: promptwarden
      containers:
        - name: gateway
          # Pin by digest in production.
          image: ghcr.io/lohith80/promptwarden:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PW_UPSTREAM_BASE_URL
              value: https://api.openai.com
            - name: PW_POLICY
              value: /etc/promptwarden/policy.yaml
            # ConfigMap updates reach the pod as a file change; this picks
            # them up without a restart. An invalid file is rejected and the
            # running policy stays in force.
            - name: PW_POLICY_RELOAD_SECONDS
              value: "30"
            # Number of trusted proxies in front of the gateway (ingress
            # controller, load balancer) for client IP attribution.
            - name: PW_TRUSTED_PROXY_HOPS
              value: "1"
            - name: PW_HEC_URL
              value: https://splunk-hec.example.com:8088
          envFrom:
            - secretRef:
                name: promptwarden-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests:
              cpu: 250m
              memory: 192Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: policy
              mountPath: /etc/promptwarden
              readOnly: true
      volumes:
        - name: policy
          configMap:
            name: promptwarden-policy
