services:
  promptwarden:
    build: .
    ports:
      - "8080:8080"
    environment:
      PW_UPSTREAM_BASE_URL: ${PW_UPSTREAM_BASE_URL:-https://api.openai.com}
      PW_EVENT_LOG: /events/promptwarden.jsonl
      # Pick up policy edits without a restart:
      PW_POLICY_RELOAD_SECONDS: "15"
      # Provider key held by the gateway (used for apps that authenticate
      # with a gateway key; see apps[].upstream_key_env in the policy):
      # OPENAI_API_KEY_SUPPORT: ${OPENAI_API_KEY_SUPPORT}
      # Optional sinks:
      # PW_HEC_URL: https://splunk.example.com:8088
      # PW_HEC_TOKEN: ${PW_HEC_TOKEN}
      # PW_WEBHOOK_URL: https://collector.example.com/promptwarden
      # PW_SYSLOG_ADDR: udp://siem.example.com:514
    volumes:
      - ./config:/app/config:ro
      - events:/events
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  events:
