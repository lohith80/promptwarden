[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptwarden"
version = "0.2.0"
description = "Security gateway for LLM and agent traffic: prompt-injection, tool-poisoning and data-egress detection with streaming inspection, per-app policy, and SOC-grade telemetry (OCSF/CEF events, Splunk/Sentinel content), mapped to OWASP LLM Top 10, OWASP Agentic Top 10 and MITRE ATLAS."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Indu Lohith Narisetty", email = "indulohithnarisetty@gmail.com" }]
keywords = ["llm-security", "prompt-injection", "ai-security", "agent-security", "mcp", "tool-poisoning", "owasp-llm-top-10", "mitre-atlas", "siem", "detection-engineering"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
]

[project.scripts]
promptwarden = "promptwarden.cli:main"

[project.urls]
Homepage = "https://github.com/lohith80/promptwarden"
Issues = "https://github.com/lohith80/promptwarden/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests; src avoids asserts anyway

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
